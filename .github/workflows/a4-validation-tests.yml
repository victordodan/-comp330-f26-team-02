
name: A4 Request Validation Tests

on:
  push:
    branches:
      - main
      - a4-aravind-request-validation
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/a4-validation-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/a4-validation-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: mvn -B clean test
