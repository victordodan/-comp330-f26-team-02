
name: A4 Java Build and Tests

on:
  push:
    branches:
      - main
      - a4-aravind-request-validation
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/a4-validation-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/a4-validation-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java build, tests, and package
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
